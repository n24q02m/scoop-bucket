name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  locks:
    name: manifests match the registry and their lock files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out bump.py from the Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: n24q02m/homebrew-tap
          path: .bump-tool
          persist-credentials: false
      - name: Manifests match the registry and their lock files
        # Gate: each manifest's artifact and lock checksums match the release it names.
        run: |
          for app in wet mnemo crg telegram notion email workspace; do
            python3 .bump-tool/scripts/bump.py "$app" --manifest "bucket/$app.json" --pinned --check
          done
      - name: Drift report
        # Not a gate: a release published since the last bump waits for bump.yml.
        run: |
          for app in wet mnemo crg telegram notion email workspace; do
            python3 .bump-tool/scripts/bump.py "$app" --manifest "bucket/$app.json" --check || echo "::warning::$app is behind the registry; dispatch bump.yml"
          done

  scoop-install:
    name: scoop install (${{ matrix.app }})
    # Installs every registry-sourced manifest on the hosted Windows runner and checks
    # that the installed CLI reports the manifest version.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: wet, cli: wet }
          - { app: mnemo, cli: n24q02m-mnemo }
          - { app: crg, cli: crg }
          - { app: telegram, cli: telegram }
          - { app: notion, cli: notion }
          - { app: email, cli: email }
          - { app: workspace, cli: workspace }
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Scoop
        # The installer is pinned to a commit and its checksum for supply chain integrity.
        run: |
          $url = 'https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1'
          Invoke-WebRequest -Uri $url -OutFile install.ps1
          $hash = (Get-FileHash install.ps1 -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '94f983b190438311e006b957db7c8422709e0ba62a6c2ac04e278164108f2512') { throw "install.ps1 checksum $hash" }
          ./install.ps1 -RunAsAdmin
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Point lock URLs at this commit
        # Manifests fetch their lock files from main; until this commit merges they exist
        # only at its sha.
        env:
          APP: ${{ matrix.app }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $path = "bucket/$env:APP.json"
          $text = (Get-Content $path -Raw).Replace('/scoop-bucket/main/locks/', "/scoop-bucket/$env:SHA/locks/")
          Set-Content -Path $path -Value $text -NoNewline
      - name: Install from this checkout
        # `scoop bucket add` only takes a Git URL, so install the manifest file directly. The
        # path must be absolute: scoop reads `bucket/<app>` as "<app> from bucket `bucket`".
        # Its `depends` (uv, nodejs) still resolve from the main bucket.
        env:
          APP: ${{ matrix.app }}
        run: |
          scoop install (Join-Path $env:GITHUB_WORKSPACE "bucket\$env:APP.json")
          if ($LASTEXITCODE) { throw "scoop install $env:APP failed" }
      - name: CLI reports the manifest version
        env:
          APP: ${{ matrix.app }}
          CLI: ${{ matrix.cli }}
        run: |
          $want = (Get-Content "bucket/$env:APP.json" -Raw | ConvertFrom-Json).version
          $got = & $env:CLI --version
          if ($LASTEXITCODE) { throw "$env:CLI --version exited $LASTEXITCODE" }
          Write-Output "$env:CLI --version: $got"
          if ("$got" -notmatch [regex]::Escape($want)) { throw "expected $want" }
